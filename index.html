
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAES Commerce | Inicio de sesión</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <main class="login-container">
        <section class="login-card">

           

<div class="logo">
    <img src="img/logo saes.jpeg" alt="Logo de SAES Productos de Empaque y Embalaje">
</div>
<div class="marca-commerce">
    SAES Commerce
</div>


            <h1>Bienvenido</h1>
            <p class="subtitle">
                Sistema de gestión de pedidos e inventario
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="usuario">Correo electrónico</label>
                    <input
                        type="email"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresa tu correo"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Ingresa tu contraseña"
                        required
                    >
                </div>

                <button type="submit">Ingresar al sistema</button>

                <p id="mensaje" class="mensaje" aria-live="polite"></p>

            </form>

            <p class="footer-text">SAES Commerce · Gestión empresarial</p>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
